<svg
    xmlns="http://www.w3.org/2000/svg"
    width="700"
    height="600"
    viewBox="0 0 700 600"
    role="img"
    aria-labelledby="title desc"
  >
    <title id="title">Strati dell'architettura su containers</title>
    <desc id="desc">Strati della macchina virtuale: Applicazione, Binari e Librerie, container engine, sistema operativo, infrastruttura Hardware.</desc>

    <defs>
      <style>
        .title {
          font: 700 34px Roboto, Helvetica, Arial, sans-serif;
          font-weight: bold;
          fill: #ffffff;
          letter-spacing: 0.2px;
        }
        .layer-label {
          font: 700 24px Roboto, Helvetica, Arial, sans-serif;
          font-weight: bold;
          fill: #ffffff;
        }
        .layer-note {
          font: 400 15px Roboto, Helvetica, Arial, sans-serif;
          font-weight: bold;
          fill: #ffffff;
        }
      </style>
    </defs>

    <rect width="700" height="600" fill="#999999"/>

    <text x="350" y="50" text-anchor="middle" class="title">Architettura basata su containers</text>

    <!-- Stack -->
    <g>
      <!-- Container 1 -->
      <rect x="10" y="80" rx="15" ry="15" width="220" height="235" fill="#1E9766"/>
      <text x="30" y="300" class="layer-label">Container 1</text>
      <text x="30" y="330" class="layer-note"></text>

      <!-- Applicazione 1 -->
      <rect x="20" y="100" rx="15" ry="15" width="200" height="75" fill="#0000FF"/>
      <text x="30" y="135" class="layer-label">Applicazione</text>
      <text x="30" y="160" class="layer-note">Word, ...</text>

      <!-- Binari e Librerie App 1 -->
      <rect x="20" y="190" rx="15" ry="15" width="200" height="75" fill="#0F7766"/>
      <text x="30" y="220" class="layer-label">Binari e Librerie</text>
      <text x="30" y="250" class="layer-note">Office</text>
      
      <!-- Container 2 -->
      <rect x="240" y="80" rx="15" ry="15" width="220" height="235" fill="#1E9766"/>
      <text x="260" y="300" class="layer-label">Container 2</text>
      <text x="260" y="330" class="layer-note"></text>

       <!-- Applicazione 2 -->
      <rect x="250" y="100" rx="15" ry="15" width="200" height="75" fill="#0000FF"/>
      <text x="260" y="130" class="layer-label">Applicazione</text>
      <text x="260" y="160" class="layer-note">Minecraft, ...</text>

      <!-- Binari e Librerie App 2-->
      <rect x="250" y="190" rx="15" ry="15" width="200" height="75" fill="#0F7766"/>
      <text x="260" y="220" class="layer-label">Binari e Librerie</text>
      <text x="260" y="250" class="layer-note">Motore grafico e di fisica</text>

      <!-- Container 3 -->
      <rect x="470" y="80" rx="15" ry="15" width="220" height="235" fill="#1E9766"/>
      <text x="490" y="300" class="layer-label">Container 3</text>
      <text x="490" y="330" class="layer-note"></text>

      <!-- Applicazione 3 -->
      <rect x="480" y="100" rx="15" ry="15" width="200" height="75" fill="#0000FF"/>
      <text x="490" y="130" class="layer-label">Applicazione</text>
      <text x="490" y="160" class="layer-note">Instagram, ...</text>

      <!-- Binari e Librerie App 3-->
      <rect x="480" y="190" rx="15" ry="15" width="200" height="75" fill="#0F7766"/>
      <text x="490" y="220" class="layer-label">Binari e Librerie</text>
      <text x="490" y="250" class="layer-note">Navigazione web</text>

      <!-- Container Engine -->
      <rect x="10" y="330" rx="15" ry="15" width="680" height="75" fill="#3D9786"/>
      <text x="20" y="360" class="layer-label">Container Engine</text>
      <text x="20" y="390" class="layer-note">Gestisce e isola i containers</text>

      <!-- OS Macchina Reale -->
      <rect x="10" y="420" rx="15" ry="15" width="680" height="75" fill="#5D97A6"/>
      <text x="20" y="450" class="layer-label">Sistema operativo Reale (80 GB)</text>
      <text x="20" y="480" class="layer-note">Windows / Linux / MacOS della macchina reale</text>

      <!-- Hardware -->
      <rect x="10" y="510" rx="15" ry="15" width="680" height="75" fill="#7D77C6"/>
      <text x="20" y="540" class="layer-label">Infrastruttura Hardware</text>
      <text x="20" y="570" class="layer-note">Server fisico, CPU, RAM, disco, rete, ...</text>
    </g>

</svg>
